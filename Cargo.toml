[package]
name = "riss_launcher"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "riss_launcher"
path = "src/main.rs"

[dependencies]
# eframe 0.32+ has official Android support
egui = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fuzzy-matcher = "0.3"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "glow",
    "default_fonts",
    "android-native-activity",
] }
android_logger = "0.14"
jni = "0.21"
once_cell = "1.19"
# AndroidApp is imported directly; keep desktop defaults disabled here.
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[profile.release]
opt-level = 2
strip = true
lto = true

