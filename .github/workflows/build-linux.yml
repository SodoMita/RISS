name: Build Linux

on:
  push:
    branches: [ build ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libgl1-mesa-dev libfontconfig1-dev pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "linux-release"
        cache-on-failure: true
    
    - name: Build release binary
      run: cargo build --release --verbose
    
    - name: Get binary info
      run: |
        ls -lh target/release/riss_launcher
        file target/release/riss_launcher
    
    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: riss-launcher-linux
        path: target/release/riss_launcher
        retention-days: 30
