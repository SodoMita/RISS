name: Clippy Report (temporary)

# Temporary diagnostic: surfaces the clippy output as check annotations so it
# can be read back from the API. Delete once CI's clippy step is green.

on:
  push:
    branches: [arena/a8e6dce9-riss]

env:
  CARGO_TERM_COLOR: never

jobs:
  report:
    name: Clippy Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libfontconfig1-dev pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-build"
          cache-on-failure: true

      - name: Run clippy
        run: |
          cargo clippy --all-targets -- -D warnings > /tmp/clippy.txt 2>&1 || true
          echo "=== clippy findings ==="
          cat /tmp/clippy.txt
          grep -oE "clippy::[a-z_0-9]+" /tmp/clippy.txt | sort | uniq -c | sort -rn > /tmp/lints.txt || true
          {
            echo "### lint counts"; cat /tmp/lints.txt
            echo "### first findings"; grep -nE "^(error|warning)" -A 10 /tmp/clippy.txt | head -c 2500
          } | python3 -c 'import sys,urllib.parse; sys.stdout.write("::error::" + urllib.parse.quote(sys.stdin.read()[:5500]) + "\n")'
