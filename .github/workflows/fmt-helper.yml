name: fmt-helper

on:
  push:
    branches: [ arena/7ca78d3d-riss ]

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libgl1-mesa-dev libfontconfig1-dev pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

    - name: Format
      run: cargo fmt

    - name: Clippy report
      run: cargo clippy --all-targets -- -D warnings > clippy-report.txt 2>&1 || true

    - name: Test report
      run: cargo test --all-targets > test-report.txt 2>&1 || true

    - name: Commit results
      run: |
        git config user.name "riss-fmt-bot"
        git config user.email "bot@riss.local"
        git add -A
        if git diff --cached --quiet; then
          echo "nothing to commit"
        else
          git commit -m "fmt-helper: cargo fmt output and reports"
          git push origin HEAD:arena/7ca78d3d-riss
        fi
