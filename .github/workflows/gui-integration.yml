name: GUI integration

# The checks in scripts/gui-assertions.sh each exist because a bug got past a
# green `cargo test`: a window that never maps, alpha requested but never
# blended, a hide setting that hides the wrong buttons, a bar clipped off a
# short output. None of that is visible to a unit test, so it needs a
# compositor. Runs on pull requests as well as pushes, because the point is to
# catch these before main has them.

on:
  push:
    branches: [ main, build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  headless-gui:
    name: Headless sway assertions (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install compositor and measurement tools
        run: |
          sudo apt-get update
          # sway provides the Wayland compositor, wlroots the headless backend,
          # mesa provides llvmpipe software GL: no GPU on the runner, and the
          # launcher must still be drawn for real.
          # libegl1/libglx0 are the virtual packages: they resolve to
          # libegl1-mesa + libglx-mesa0 on Debian bookworm and to
          # libegl-mesa0 + libglx-mesa0 on Ubuntu noble (ubuntu-latest),
          # where the concrete names the rig was calibrated with do not
          # exist.
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libglx0 mesa-utils \
            sway grim imagemagick x11-utils libinput10 libxkbcommon0 \
            fonts-dejavu-core
      - name: Build
        run: cargo build -j $(nproc)

      - name: Run GUI assertions
        # pipefail is not optional here: `script | tee` without it reports tee's
        # exit status, so the job could never fail -- a CI check that cannot go
        # red is worse than no check, and this is the exact class of hole the
        # assertions below exist to catch.
        run: |
          set -o pipefail
          ./scripts/gui-assertions.sh | tee gui-assert.log

      - name: Say in the summary whether anything was measured
        if: always()
        run: |
          {
            echo "## Headless GUI assertions"
            echo ""
            if grep -q "did NOT run" gui-assert.log 2>/dev/null; then
              echo "**SKIPPED: the compositor never started, so nothing was measured.**"
              echo ""
              echo "This is not a pass. Usually it means the tool set could not be installed on this runner image."
            elif grep -q "all cases passed" gui-assert.log 2>/dev/null; then
              echo "All cases passed. Numbers behind the thresholds:"
            else
              echo "**FAILED** (see the log; the frames are in the uploaded artifact)."
            fi
            echo ""
            echo '```'
            grep -E "red through the window|red:|colours|window rect|not blending|missing; GUI" gui-assert.log 2>/dev/null | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the frames that were measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-artifacts
          path: gui-artifacts/
          if-no-files-found: warn
          retention-days: 7

      # The same commit also guards the per-keystroke allocation budget in
      # `cargo test` (tests::perf::*), which is cheaper there than here; this
      # job exists only for what needs a compositor.
