name: Diagnostics

# Temporary helper used while porting the launcher: it runs the same checks as
# test.yml but reports every compiler / clippy / test diagnostic as a workflow
# annotation, so they can be read without downloading the job log.
# This file is removed once the port is finished.

on:
  push:
    branches: [ arena/3aa9449a-riss ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  diagnostics:
    name: Clippy & test diagnostics
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libfontconfig1-dev pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Prepare helpers
        run: |
          cat > /tmp/annotate_compiler.py <<'PY'
          import json, sys
          path, tag = sys.argv[1], sys.argv[2]
          count = 0
          for line in open(path, errors="replace"):
              try:
                  msg = json.loads(line)
              except Exception:
                  continue
              if msg.get('reason') != 'compiler-message':
                  continue
              m = msg['message']
              if m.get('level') not in ('error', 'warning'):
                  continue
              spans = [s for s in m.get('spans', []) if s.get('is_primary')]
              if not spans:
                  continue
              s = spans[0]
              code = (m.get('code') or {}).get('code') or ''
              text = m['message'].replace('\\n', ' ')[:700]
              print("::error file=%s,line=%s,col=%s,title=%s %s::%s" % (
                  s['file_name'], s['line_start'], s['column_start'], tag, code, text))
              count += 1
              if count > 80:
                  break
          PY
          cat > /tmp/annotate_test.py <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          out = []
          for i, line in enumerate(lines):
              text = line.strip()
              if not text:
                  continue
              hit = (
                  text.startswith('failures')
                  or text.startswith('error')
                  or text.startswith('test result')
                  or 'FAILED' in text
                  or 'panicked at' in text
                  or text.startswith('running ')
              )
              if not hit:
                  continue
              esc = text.replace('%', '%25').replace('\\r', '%0D')
              out.append("::error title=test,file=test-output.txt,line=%d::%s" % (i + 1, esc[:700]))
          print('\\n'.join(out[:80]) or '::notice title=test::no test failures found')
          if not out:
              print("::error title=test::no test summary found; tail follows")
              for line in lines[-40:]:
                  print("::warning title=test-tail,file=test-output.txt::%s" % line.replace('%', '%25')[:400])
          PY
          echo prepared

      - name: Report clippy diagnostics
        run: |
          cargo clippy --all-targets --message-format=json > /tmp/clippy.json 2>/tmp/clippy.err || true
          python3 /tmp/annotate_compiler.py /tmp/clippy.json clippy || true

      - name: Report test failures
        run: |
          cargo test > /tmp/test.out 2>&1 || true
          python3 /tmp/annotate_test.py /tmp/test.out || true