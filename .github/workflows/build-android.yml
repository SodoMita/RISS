name: Build Android

on:
  push:
    branches: [ build ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 25.2.9519653

jobs:
  build-android:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            arch: armeabi-v7a
          - target: x86_64-linux-android
            arch: x86_64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "android-${{ matrix.arch }}"
        cache-on-failure: true
    
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked
    
    - name: Install Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android NDK
      run: |
        sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
        echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
    
    - name: Build for ${{ matrix.arch }}
      run: |
        cargo ndk -t ${{ matrix.arch }} -o target/android/lib/${{ matrix.arch }} build --release
        if [ -d "target/android/lib/${{ matrix.arch }}/${{ matrix.arch }}" ]; then
          mv target/android/lib/${{ matrix.arch }}/${{ matrix.arch }}/*.so target/android/lib/${{ matrix.arch }}/ 2>/dev/null || true
          rmdir target/android/lib/${{ matrix.arch }}/${{ matrix.arch }} 2>/dev/null || true
        fi
    
    - name: Upload library
      uses: actions/upload-artifact@v4
      with:
        name: lib-${{ matrix.arch }}
        path: target/android/lib/${{ matrix.arch }}/*.so
        retention-days: 1

  package-apk:
    name: Package APK
    runs-on: ubuntu-latest
    needs: build-android
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android build tools
      run: |
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-33"
        sdkmanager "build-tools;33.0.2"
    
    - name: Download all libraries
      uses: actions/download-artifact@v4
      with:
        path: target/android/lib
    
    - name: Organize libraries
      run: |
        mkdir -p target/apk-build/lib
        for arch in arm64-v8a armeabi-v7a x86_64; do
          mkdir -p target/apk-build/lib/$arch
          cp target/android/lib/lib-$arch/*.so target/apk-build/lib/$arch/ 2>/dev/null || true
        done
    
    - name: Package APK
      run: |
        cd target/apk-build
        cp ../../android/AndroidManifest.xml .
        AAPT="$ANDROID_HOME/build-tools/33.0.2/aapt"
        "$AAPT" package -f \
          -M AndroidManifest.xml \
          -I "$ANDROID_HOME/platforms/android-33/android.jar" \
          -F app-base.apk
        zip -r app-base.apk lib/
        mv app-base.apk app-unsigned.apk
    
    - name: Align APK
      run: |
        ZIPALIGN="$ANDROID_HOME/build-tools/33.0.2/zipalign"
        "$ZIPALIGN" -f 4 target/apk-build/app-unsigned.apk target/apk-build/app-aligned.apk
    
    - name: Sign APK
      run: |
        mkdir -p ~/.android
        keytool -genkey -v \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        
        APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
        "$APKSIGNER" sign \
          --ks ~/.android/debug.keystore \
          --ks-pass pass:android \
          --ks-key-alias androiddebugkey \
          --key-pass pass:android \
          --out riss-launcher.apk \
          target/apk-build/app-aligned.apk
    
    - name: Verify APK
      run: |
        APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
        "$APKSIGNER" verify --verbose riss-launcher.apk
    
    - name: Get APK info
      run: |
        ls -lh riss-launcher.apk
        AAPT="$ANDROID_HOME/build-tools/33.0.2/aapt"
        "$AAPT" dump badging riss-launcher.apk | head -20
        unzip -l riss-launcher.apk
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: riss-launcher-android
        path: riss-launcher.apk
        retention-days: 30
