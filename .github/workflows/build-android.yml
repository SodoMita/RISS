name: Build Android

on:
  push:
    branches: [ build ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 25.2.9519653

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Add Android targets
      run: |
        rustup target add aarch64-linux-android
        rustup target add armv7-linux-androideabi
        rustup target add x86_64-linux-android
    
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
    
    - name: Install Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android NDK
      run: |
        sdkmanager "ndk;${{ env.NDK_VERSION }}"
        echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
    
    - name: Install Android build tools
      run: |
        sdkmanager "platform-tools"
        sdkmanager "platforms;android-33"
        sdkmanager "build-tools;33.0.2"
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build for arm64-v8a
      run: |
        cargo ndk -t arm64-v8a -o target/android/lib/arm64-v8a build --release
        if [ -d "target/android/lib/arm64-v8a/arm64-v8a" ]; then
          mv target/android/lib/arm64-v8a/arm64-v8a/*.so target/android/lib/arm64-v8a/ 2>/dev/null || true
          rmdir target/android/lib/arm64-v8a/arm64-v8a 2>/dev/null || true
        fi
    
    - name: Build for armeabi-v7a
      run: |
        cargo ndk -t armeabi-v7a -o target/android/lib/armeabi-v7a build --release
        if [ -d "target/android/lib/armeabi-v7a/armeabi-v7a" ]; then
          mv target/android/lib/armeabi-v7a/armeabi-v7a/*.so target/android/lib/armeabi-v7a/ 2>/dev/null || true
          rmdir target/android/lib/armeabi-v7a/armeabi-v7a 2>/dev/null || true
        fi
    
    - name: Build for x86_64
      run: |
        cargo ndk -t x86_64 -o target/android/lib/x86_64 build --release
        if [ -d "target/android/lib/x86_64/x86_64" ]; then
          mv target/android/lib/x86_64/x86_64/*.so target/android/lib/x86_64/ 2>/dev/null || true
          rmdir target/android/lib/x86_64/x86_64 2>/dev/null || true
        fi
    
    - name: Package APK
      run: |
        mkdir -p target/apk-build/lib
        cd target/apk-build
        
        # Copy manifest
        cp ../../android/AndroidManifest.xml .
        
        # Copy libraries
        cp -r ../android/lib/* lib/
        
        # Package with aapt
        AAPT="$ANDROID_HOME/build-tools/33.0.2/aapt"
        "$AAPT" package -f \
          -M AndroidManifest.xml \
          -I "$ANDROID_HOME/platforms/android-33/android.jar" \
          -F app-base.apk
        
        # Add lib directory
        zip -r app-base.apk lib/
        mv app-base.apk app-unsigned.apk
    
    - name: Align APK
      run: |
        ZIPALIGN="$ANDROID_HOME/build-tools/33.0.2/zipalign"
        "$ZIPALIGN" -f 4 target/apk-build/app-unsigned.apk target/apk-build/app-aligned.apk
    
    - name: Sign APK
      run: |
        # Generate debug keystore
        mkdir -p ~/.android
        keytool -genkey -v \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        
        # Sign APK
        APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
        "$APKSIGNER" sign \
          --ks ~/.android/debug.keystore \
          --ks-pass pass:android \
          --ks-key-alias androiddebugkey \
          --key-pass pass:android \
          --out riss-launcher.apk \
          target/apk-build/app-aligned.apk
    
    - name: Verify APK
      run: |
        APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
        "$APKSIGNER" verify --verbose riss-launcher.apk
    
    - name: Get APK info
      run: |
        ls -lh riss-launcher.apk
        AAPT="$ANDROID_HOME/build-tools/33.0.2/aapt"
        "$AAPT" dump badging riss-launcher.apk | head -20
        unzip -l riss-launcher.apk
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: riss-launcher-android
        path: riss-launcher.apk
        retention-days: 30
