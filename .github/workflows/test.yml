name: Tests

on:
  push:
    branches: [ main, build ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libgl1-mesa-dev libfontconfig1-dev pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "test-build"
        cache-on-failure: true
    
    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --all-targets --verbose

  check-android:
    name: Check Android target
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "android-check"
        cache-on-failure: true

    - name: Check Android compilation
      run: cargo check --target aarch64-linux-android --all-targets

  gui-smoke:
    name: GUI smoke test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install display servers and screenshot tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev libgl1-mesa-dev libfontconfig1-dev pkg-config \
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          xvfb cage grim imagemagick xkb-data libxkbcommon0 libxkbcommon-x11-0 \
          libgl1-mesa-dri libegl1 libglx-mesa0

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "test-build"
        cache-on-failure: true

    - name: Build
      run: cargo build

    - name: Smoke test under Xvfb (X11)
      run: bash scripts/gui-smoke-test.sh xvfb

    - name: Smoke test under cage (Wayland headless)
      run: bash scripts/gui-smoke-test.sh wayland

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-screenshots
        path: smoke-artifacts/
        if-no-files-found: ignore
