name: Tests

on:
  push:
    branches: [ main, build ]
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write


env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libgl1-mesa-dev libfontconfig1-dev pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        cargo clippy -- -D warnings 2>&1 | tee /tmp/clippy.log
        STATUS=${PIPESTATUS[0]}
        if [ "$STATUS" -ne 0 ]; then
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/clippy.log
          exit "$STATUS"
        fi
    
    - name: Run tests
      run: cargo test --verbose
