# Temporary: records the new zbus dependency in Cargo.lock (the authoring
# sandbox cannot reach crates.io), then deletes itself.
name: Update Cargo.lock (temporary)

on:
  push:
    branches: [ arena/2d671f0d-riss ]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve new dependencies
      run: cargo fetch
    - name: Commit lockfile
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git rm -q .github/workflows/tmp-update-lock.yml
        git add Cargo.lock
        git diff --cached --stat
        git commit -m "Record zbus in Cargo.lock"
        git push origin HEAD:arena/2d671f0d-riss
