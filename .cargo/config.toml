# Build configuration for faster linking
# On systems with lld installed, uncomment the linker lines below for 2-5x faster linking

# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[build]
# Use multiple threads for compilation
jobs = 8

[profile.dev]
# Faster debug builds
debug = 1
incremental = true
